openapi: 3.0.3
info:
  title: EcoReward API
  version: 1.0.0
servers:
  - url: http://localhost:4000

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Pickups
  - name: Pricing
  - name: SME
  - name: Admin
  - name: Ledger
  - name: AI

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: OK

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register user (default CITIZEN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                phone: { type: string }
                password: { type: string }
              required: [name, password]
      responses:
        "201": { description: Created }
        "400": { description: Bad Request }
        "409": { description: Conflict }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                phone: { type: string }
                password: { type: string }
              required: [password]
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }
