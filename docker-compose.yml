version: "3.9"

services:
  backend:
    build: .
    ports:
      - "4000:4000"
    depends_on:
      - db
    networks:
      - backend-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecoreward
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-network

volumes:
  db_data:

networks:
  backend-network:
    driver: bridge

